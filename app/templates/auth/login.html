{% extends "base.html" %}
{% block title %}Log in | CropCare Expert{% endblock %}
{% block content %}
<div class="form-panel mx-auto">
  <p class="eyebrow mb-2">Welcome back</p>
  <h1 class="h2 mb-4">Log in</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-success w-100" type="submit">Log in</button>
  </form>
  <p class="small text-center mt-3 mb-0">Need an account? <a href="{{ url_for('auth.register') }}">Register as a farmer</a>.</p>
</div>
{% endblock %}

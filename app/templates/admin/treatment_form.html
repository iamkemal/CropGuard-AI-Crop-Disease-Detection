{% extends "base.html" %}
{% block title %}{{ 'Edit' if treatment else 'Add' }} recommendation | CropGuard{% endblock %}
{% block content %}
<section data-editor-panel class="form-panel mx-auto wide-form">
  <p class="eyebrow mb-2">Knowledge base</p>
  <h1 class="h2 mb-4">{{ 'Edit recommendation' if treatment else 'Add recommendation' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="disease_id">Disease</label><select class="form-select" id="disease_id" name="disease_id" required><option value="">Choose a disease</option>{% for disease in diseases %}<option value="{{ disease['id'] }}" {% if treatment and treatment['disease_id'] == disease['id'] %}selected{% endif %}>{{ disease['crop_name'] }} — {{ disease['name'] }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required><option value="treatment" {% if treatment and treatment['category'] == 'treatment' %}selected{% endif %}>Treatment</option><option value="prevention" {% if treatment and treatment['category'] == 'prevention' %}selected{% endif %}>Prevention</option></select></div>
    <div class="mb-3"><label class="form-label" for="recommendation">Recommendation</label><textarea class="form-control" id="recommendation" name="recommendation" maxlength="2000" rows="5" required>{{ treatment['recommendation'] if treatment else '' }}</textarea></div>
    <div class="mb-4"><label class="form-label" for="sort_order">Display order</label><input class="form-control" id="sort_order" name="sort_order" type="number" min="0" max="10000" value="{{ treatment['sort_order'] if treatment else 0 }}" required></div>
    <div class="d-flex gap-2"><button class="btn btn-success" type="submit">Save recommendation</button><a class="btn btn-outline-secondary" href="{{ url_for('admin.treatments') }}" data-editor-cancel>Cancel</a></div>
  </form>
</section>
{% endblock %}
